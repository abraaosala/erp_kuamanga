name: Deploy completo (vendor)

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Motivo do deploy (ex: composer.lock atualizado)'
        required: false
        default: 'Sincronização completa inicial / dependências alteradas'

jobs:
  deploy-full:
    name: Deploy completo ao InfinityFree
    runs-on: ubuntu-latest
    concurrency: production-deploy
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Install PHP production dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Sync completo via lftp (paralelo, inclui vendor/)
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          sudo apt-get update && sudo apt-get install -y lftp >/dev/null
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" -e "
            set ssl:verify-certificate no
            set net:timeout 60
            set net:max-retries 3
            set ftp:use-pret off
            set mirror:parallel-transfer-count 8
            mirror --reverse --delete --only-newer --parallel=8 \
              --exclude-glob '.*' \
              --exclude-glob 'node_modules*' \
              --exclude-glob 'storage*' \
              --exclude-glob 'tests*' \
              --exclude-glob 'docs*' \
              --exclude-glob 'scripts*' \
              --exclude-glob 'vendor.zip' \
              --exclude-glob '*.md' \
              --exclude-glob '*.log' \
              ./ \"$FTP_DIR\"
            quit
          "
          echo "Sync completo concluído (paralelo=8, delete de órfãos ativo)."