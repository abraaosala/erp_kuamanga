name: Deploy completo (vendor)

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Motivo do deploy (ex: composer.lock atualizado)'
        required: false
        default: 'Sincronização completa inicial / dependências alteradas'

jobs:
  deploy-full:
    name: Deploy completo ao InfinityFree
    runs-on: ubuntu-latest
    concurrency: production-deploy
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Install PHP production dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Deploy completo via FTP (inclui vendor/)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          protocol: ftp
          port: 21
          timeout: 60000
          exclude: |
            **/.git*
            **/.git*/**
            **/.env*
            **/node_modules/**
            tests/**
            .github/**
            .opencode/**
            docs/**
            scripts/**
            *.md
            storage/uploads/**
            storage/cache/**
            storage/logs/**
            storage/dumps/**

      - name: Purge dev-deps órfãos do vendor no servidor
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          sudo apt-get update && sudo apt-get install -y lftp >/dev/null
          php -r '$l=json_decode(file_get_contents("composer.lock"),true); foreach(array_column($l["packages-dev"],"name") as $n){ echo "vendor/$n\n"; }' > /tmp/dev-paths.txt
          run_one() {
            d="$1"
            if lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" \
                  -e "set ssl:verify-certificate no; set net:timeout 45; set net:max-retries 2; set ftp:use-pret off; cd $FTP_DIR; rm -rf $d; quit" >/dev/null 2>&1; then
              echo "OK   $d"
            else
              echo "FAIL $d"
            fi
          }
          export -f run_one
          {
            echo vendor/pest-plugins
            cat /tmp/dev-paths.txt
            echo vendor/pest-plugins.json
          } | xargs -P 8 -I {} bash -c 'run_one "$@"' _ {} | sort