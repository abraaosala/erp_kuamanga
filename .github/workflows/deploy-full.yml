name: Deploy completo (vendor)

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Motivo do deploy (ex: composer.lock atualizado)'
        required: false
        default: 'Sincronização completa inicial / dependências alteradas'

jobs:
  deploy-full:
    name: Deploy completo ao InfinityFree
    runs-on: ubuntu-latest
    concurrency: production-deploy
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Install PHP production dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Deploy completo via FTP (inclui vendor/)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          protocol: ftp
          port: 21
          timeout: 60000
          exclude: |
            **/.git*
            **/.htaccess
            **/.env*
            **/node_modules/**
            tests/**
            .github/**
            docs/**
            scripts/**
            *.md
            storage/uploads/**
            storage/cache/**
            storage/logs/**
            storage/dumps/**