name: Purge dev-deps do vendor em produção

on:
  workflow_dispatch:

jobs:
  purge:
    name: Apagar pacotes dev e resíduos do docroot
    runs-on: ubuntu-latest
    concurrency: production-deploy
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Gerar lista de pacotes dev (composer.lock)
        id: devlist
        run: |
          php -r '$l=json_decode(file_get_contents("composer.lock"),true); foreach(array_column($l["packages-dev"],"name") as $n){ echo "vendor/$n\n"; }' > /tmp/dev-paths.txt
          echo "Pacotes dev a remover: $(wc -l < /tmp/dev-paths.txt)"

      - name: Purge via lftp
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          sudo apt-get update && sudo apt-get install -y lftp >/dev/null
          CMDS="set ssl:verify-certificate no; set net:timeout 30; set net:max-retries 2; set ftp:use-pret off; cd $FTP_DIR; rm -rf vendor/pest-plugins; rm -f vendor/pest-plugins.json"
          while read -r p; do CMDS="$CMDS; rm -rf $p"; done < /tmp/dev-paths.txt
          CMDS="$CMDS; rm -rf .git; rm -rf .opencode; rm -f .php-cs-fixer.php; rm -f .php-cs-fixer.cache"
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" -e "$CMDS; quit"