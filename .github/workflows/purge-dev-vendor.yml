name: Purge dev-deps do vendor em produção

on:
  workflow_dispatch:

jobs:
  purge:
    name: Apagar pacotes dev e resíduos do docroot
    runs-on: ubuntu-latest
    concurrency: production-deploy
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Gerar lista de pacotes dev (composer.lock)
        id: devlist
        run: |
          php -r '$l=json_decode(file_get_contents("composer.lock"),true); foreach(array_column($l["packages-dev"],"name") as $n){ echo "vendor/$n\n"; }' > /tmp/dev-paths.txt
          echo "Pacotes dev a remover: $(wc -l < /tmp/dev-paths.txt)"

      - name: Purge via lftp
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          {
            echo "set ssl:verify-certificate no"
            echo "set net:timeout 30"
            echo "set net:max-retries 2"
            echo "set ftp:use-pret off"
            echo "open ftp://$FTP_HOST"
            echo "cd $FTP_DIR"
            echo "rm -rf vendor/pest-plugins"
            echo "rm -f  vendor/pest-plugins.json"
            while read -r p; do echo "rm -rf $p"; done < /tmp/dev-paths.txt
            echo "rm -rf .git"
            echo "rm -rf .opencode"
            echo "rm -f  .php-cs-fixer.php"
            echo "rm -f  .php-cs-fixer.cache"
            echo "quit"
          } > /tmp/purge.lftp
          lftp -u "$FTP_USER","$FTP_PASS" -f /tmp/purge.lftp