name: Purge dev-deps do vendor em produção

on:
  workflow_dispatch:

jobs:
  purge:
    name: Apagar pacotes dev e resíduos do docroot
    runs-on: ubuntu-latest
    concurrency: production-deploy
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Gerar lista de pacotes dev (composer.lock)
        id: devlist
        run: |
          php -r '$l=json_decode(file_get_contents("composer.lock"),true); foreach(array_column($l["packages-dev"],"name") as $n){ echo "vendor/$n\n"; }' > /tmp/dev-paths.txt
          echo "Pacotes dev a remover: $(wc -l < /tmp/dev-paths.txt)"

      - name: Purge via lftp (paralelo)
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          sudo apt-get update && sudo apt-get install -y lftp >/dev/null
          run_one() {
            d="$1"
            if lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" \
                  -e "set ssl:verify-certificate no; set net:timeout 45; set net:max-retries 2; set ftp:use-pret off; cd $FTP_DIR; rm -rf $d; quit" >/dev/null 2>&1; then
              echo "OK   $d"
            else
              echo "FAIL $d"
            fi
          }
          export -f run_one
          {
            echo vendor/pest-plugins
            cat /tmp/dev-paths.txt
            echo .git
            echo .opencode
            echo .php-cs-fixer.php
            echo .php-cs-fixer.cache
          } | xargs -P 8 -I {} bash -c 'run_one "$@"' _ {} | sort
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" \
            -e "set ssl:verify-certificate no; set net:timeout 45; set net:max-retries 2; set ftp:use-pret off; cd $FTP_DIR; rm -f vendor/pest-plugins.json; quit" >/dev/null 2>&1 | true